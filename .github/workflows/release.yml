name: Release & Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm (Provenance & Trusted Publishing)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance and OIDC Trusted Publishing
    environment:
      name: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Run test suite
        run: npm test

      - name: Verify CLI smoke tests
        run: npm run smoke

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
